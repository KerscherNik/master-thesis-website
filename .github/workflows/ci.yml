# Test on every push and pull request; deploy to GitHub Pages when main is green.
#
# One-time repo setup: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Nothing else to configure.

name: CI

permissions: {}

on:
  push:
    branches: [main]
    # docs-only pushes skip the whole run; nothing below is deployed anyway.
    # Caveat: if a status check is ever marked required in branch protection,
    # move this filtering into a gate job instead (skipped workflows never
    # report their checks).
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

# supersede PR runs on new pushes; main pushes get unique groups (run_id)
# so a deploy is never cancelled mid-flight
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Resolve Playwright version (browser cache key)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium (Chrome for Testing, ships H.264)
        # --with-deps dropped: ubuntu-latest images carry Chromium's system
        # deps, and apt ran on every cache hit. If a future image breaks,
        # add a separate `npx playwright install-deps chromium` step back.
        run: npx playwright install chromium

      - name: End-to-end tests (Playwright)
        run: npm run test:e2e

      - name: Upload traces on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble site (page + assets only, no dev tooling)
        run: |
          mkdir -p _site
          cp index.html robots.txt manifest.webmanifest _site/
          sed "s/__BUILD__/${GITHUB_SHA}/" sw.js > _site/sw.js
          cp -r static _site/static

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
